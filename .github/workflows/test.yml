name: Test

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - run: npm ci
        working-directory: examples/demo-client

      - run: npm run build
        working-directory: examples/demo-client

      - run: npm run lint
        working-directory: examples/demo-client
